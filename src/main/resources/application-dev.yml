spring:
  datasource:
    url: jdbc:h2:mem:jurisfacil_dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:jurisfacil-local-development-secret-32}
