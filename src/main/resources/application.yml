spring:
  application:
    name: juris-facil-backend
  profiles:
    active: dev

management:
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    db:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    rate-limit:
      paths:
        - /api/auth/login
        - /api/v1/_dev/echo
        - /api/auth/login
